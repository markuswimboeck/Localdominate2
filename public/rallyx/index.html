<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>RallyX Website Configurator · LocalDominate</title>
<style>
:root{--bg:#ECEEF0;--card:#fff;--fg:#14181C;--muted:#56606A;--line:#D3D8DD;--acc:#C2410C;--err:#9A3412}
@media (prefers-color-scheme: dark){:root{--bg:#101316;--card:#181C20;--fg:#ECEFF2;--muted:#9AA4AE;--line:#2C333A;--acc:#FF7A3D;--err:#FF9C73;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:420px;background:var(--card);border:2px solid var(--fg);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.k{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
h1{margin:0;font:900 40px/0.95 Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--acc)}
p{margin:0;color:var(--muted)}
label{font-weight:600;font-size:14px}
input[type=password]{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:transparent;color:var(--fg)}
button{min-height:48px;border:0;border-radius:999px;background:var(--acc);color:#fff;font:600 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.err{color:var(--err);font-size:14px;min-height:1.2em}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">

  <p>The website configurator from your proposal. Enter the password from the order page of the PDF proposal.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" required autofocus>
  <label class="row"><input id="rem" type="checkbox"> Remember on this device</label>
  <button id="go" type="submit">Open configurator</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">LocalDominate · Markus Wimböck · info@localdominate.org</div>
</form>

async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
